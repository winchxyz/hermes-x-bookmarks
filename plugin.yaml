manifest_version: 2
name: hermes-x-bookmarks
version: "0.2.0"
description: "Hermes reads your X bookmarks (long posts and Articles too), sorts them with your own model and exports them to a Desktop board, Obsidian, Notion or Google Docs."
author: winchxyz
kind: standalone
license: MIT
homepage: https://github.com/winchxyz/hermes-x-bookmarks
requires_hermes: ">=0.23.0"
tags: [x, twitter, bookmarks, notion, obsidian, google-docs, productivity]
provides_tools: []
provides_hooks: []
optional_env:
  # X sign-in, option 1 (simplest): OAuth 1.0a keys of your own X app (Keys and tokens page).
  - name: XBM_X_API_KEY
    description: "X app API Key (Consumer Key), from your app's Keys and tokens page"
    url: "https://console.x.com"
    secret: true
  - name: XBM_X_API_SECRET
    description: "X app API Key Secret (Consumer Secret)"
    secret: true
  - name: XBM_X_ACCESS_TOKEN
    description: "Access Token of your own X account for this app (generate it after setting Read permission)"
    secret: true
  - name: XBM_X_ACCESS_TOKEN_SECRET
    description: "Access Token Secret that goes with the Access Token"
    secret: true
  # X sign-in, option 2: OAuth 2.0 through Hermes (hermes auth add hermes-x-bookmarks:x).
  - name: XBM_X_CLIENT_ID
    description: "OAuth 2.0 Client ID of your own X developer app (Native App, read-only). Sign in with `hermes auth add hermes-x-bookmarks:x`."
    url: "https://console.x.com"
  # Notion export: token of your own Notion connection (internal integration or personal access token).
  - name: XBM_NOTION_TOKEN
    description: "Notion connection token for /xbm export notion. Share one page with the connection."
    url: "https://www.notion.so/profile/integrations"
    secret: true
  # Google Docs export: your own Google Cloud OAuth client (type Desktop app), scope drive.file only.
  - name: XBM_GOOGLE_CLIENT_ID
    description: "Client ID of your own Google Cloud OAuth client (Desktop app). Sign in with `hermes auth add hermes-x-bookmarks:google`."
    url: "https://console.cloud.google.com/auth/clients"
  - name: XBM_GOOGLE_CLIENT_SECRET
    description: "Client secret of that Google Desktop app client"
    secret: true
# Hermes runs the X sign-in, stores the grant in this profile's auth.json and refreshes it.
# The plugin never holds a token: every X call goes through credentialed_provider_request("x", ...).
oauth:
  - id: x
    authorize_url: https://x.com/i/oauth2/authorize
    token_url: https://api.x.com/2/oauth2/token
    scopes: [tweet.read, users.read, bookmark.read, offline.access]
    client_id_env: XBM_X_CLIENT_ID
    hosts: [api.x.com]
  # Google Docs export. drive.file: only the document this plugin creates, nothing else in Drive.
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes: [https://www.googleapis.com/auth/drive.file]
    client_id_env: XBM_GOOGLE_CLIENT_ID
    client_secret_env: XBM_GOOGLE_CLIENT_SECRET
    hosts: [docs.googleapis.com]
    authorize_params:
      access_type: offline
      prompt: consent
config_schema:
  auth_backend:
    type: str
    default: "auto"
    choices: ["auto", "keys", "hermes", "xurl"]
    label: "X sign-in"
    description: "auto: keys when all four XBM_X_* keys are set, else hermes. keys: OAuth 1.0a keys of your own X app. hermes: Hermes' own sign-in (hermes auth add hermes-x-bookmarks:x). xurl: the official X CLI (xurl token)."
  xurl_app:
    type: str
    default: ""
    label: "xurl app name"
    description: "Only for the xurl sign-in: the app name you gave `xurl auth apps add`. Empty uses xurl's default app."
  categories:
    type: str
    default: "AI & agents, Coding & dev tools, Crypto & web3, Business & growth, Design & art, Learning & guides, News & opinion, Life & misc"
    label: "Bookmark categories"
    description: "Comma-separated categories the model sorts bookmarks into. \"Other\" is always added, with a suggested new name."
  classify_language:
    type: str
    default: "English"
    label: "Summary language"
    description: "Language of the one-line summary and the why-saved note, e.g. English or Russian."
  about_me:
    type: str
    default: ""
    label: "About you"
    description: "A sentence or two on what you build and follow. Sorting uses it to judge priority. Set it with /xbm about <text>."
  export_dir:
    type: str
    default: ""
    label: "Export folder"
    description: "Where /xbm export desktop writes bookmarks.md and board.html. Empty: an 'X Bookmarks' folder on your Desktop."
  export_to:
    type: str
    default: "desktop"
    label: "Export to"
    description: "What a plain /xbm export writes, comma-separated: desktop, obsidian, notion, gdocs."
  obsidian_vault:
    type: str
    default: ""
    label: "Obsidian vault"
    description: "Folder of your Obsidian vault. Notes go to its 'X Bookmarks' folder. Empty: the vault Obsidian has open."
  notion_page:
    type: str
    default: ""
    label: "Notion page"
    description: "URL of the Notion page that holds the X Bookmarks database. Share it with your Notion connection first."
