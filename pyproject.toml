[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-x-bookmarks"
version = "0.2.3"
description = "Hermes reads your X bookmarks (long posts and Articles too), sorts them with your own model and puts them on a board on your Desktop (Hermes Agent plugin)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "winchxyz"}]
# Runtime only. Test tools live in requirements-dev.txt, never in an install extra.
# Every HTTP API (X, Notion, Google) is called with httpx: no vendor SDKs.
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/winchxyz/hermes-x-bookmarks"

[tool.setuptools]
packages = ["hermes_x_bookmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["live: needs real X / Notion / Google credentials"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS/JS of the board page lives in one string
"hermes_x_bookmarks/board_template.py" = ["E501"]
